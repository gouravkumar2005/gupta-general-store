services:
  - type: web
    name: gupta-store-api
    runtime: node
    plan: free
    # No rootDir: this is an npm-workspaces monorepo, so install must run from
    # the repo root for @gupta/shared (a local workspace package) to resolve.
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npm run start -w apps/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gupta-store-db
          property: connectionString
      - key: PORT
        value: 4000

databases:
  - name: gupta-store-db
    plan: free
    databaseName: gupta_store
    user: gupta
